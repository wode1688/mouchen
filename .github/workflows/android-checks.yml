name: Android checks

on:
  push:
    paths:
      - 'AI-Twin/android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    paths:
      - 'AI-Twin/android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-and-unit-tests:
    name: ${{ matrix.variant }} debug and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [PrivateAlpha, PlayRelease]
    defaults:
      run:
        working-directory: AI-Twin/android
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false
      - name: Build debug application and run synthetic unit tests
        run: >-
          gradle --no-daemon --console=plain --stacktrace
          assemble${{ matrix.variant }}Debug
          test${{ matrix.variant }}DebugUnitTest
      - name: Keep tested debug APK for device verification
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.variant }}-debug
          path: AI-Twin/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
