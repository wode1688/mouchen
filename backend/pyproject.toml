[project]
name = "mouchen-backend"
version = "0.1.0"
description = "Private-alpha proactive engine for My AI Twin"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.138,<0.139",
  "uvicorn>=0.49,<0.50",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<0.29",
  "argon2-cffi==25.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"
