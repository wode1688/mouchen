name: MouchenIOS
options:
  bundleIdPrefix: com.mouchen
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0-alpha01
targets:
  Mouchen:
    type: application
    platform: iOS
    sources:
      - path: Mouchen
      - path: Shared
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/Mouchen.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouchen.ios
        PRODUCT_MODULE_NAME: Mouchen
        PRODUCT_NAME: AI替身
    dependencies:
      - target: MouchenShare
        embed: true
  MouchenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MouchenShare
      - path: Shared
    info:
      path: Config/ShareInfo.plist
    entitlements:
      path: Config/MouchenShare.entitlements
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mouchen.ios.share
        PRODUCT_MODULE_NAME: MouchenShare
        PRODUCT_NAME: 发送到AI替身
        SKIP_INSTALL: YES
  MouchenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MouchenTests
    dependencies:
      - target: Mouchen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouchen.ios.tests
